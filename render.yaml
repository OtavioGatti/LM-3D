services:
  - type: web
    name: lm-3d-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build --workspace @lm-3d/shared && npm run build --workspace @lm-3d/api
    startCommand: npm run start --workspace @lm-3d/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: API_PUBLIC_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://otaviogatti.github.io,https://*.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
